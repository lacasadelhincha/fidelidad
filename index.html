<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa del Hincha - Fidelidad</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b61c1c">
    <style>
        :root {
            --rojo-principal: #b61c1c;
            --azul-oscuro: #0d2347;
            --dorado: #dfa72b;
            --blanco: #ffffff;
            --gris-fondo: #f4f6f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--azul-oscuro);
            background-image: linear-gradient(135deg, var(--azul-oscuro) 0%, #050e1e 100%);
            color: var(--blanco);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card-container {
            background-color: var(--blanco);
            color: #333;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid var(--dorado);
        }

        .card-header {
            background-color: var(--rojo-principal);
            padding: 20px 15px;
            text-align: center;
            border-bottom: 4px solid var(--dorado);
        }

        .saludo-cliente {
            color: var(--blanco);
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: capitalize;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .card-header img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid var(--dorado);
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            object-fit: cover;
            margin-bottom: 15px;
        }

        .card-header h2 {
            color: var(--dorado);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            font-weight: 800;
        }

        .card-body {
            padding: 20px;
            background-color: var(--gris-fondo);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-text {
            text-align: center;
            font-size: 1rem;
            color: #1a202c;
            margin-bottom: 18px;
            font-weight: 700;
            line-height: 1.4;
        }

        .grid-tablero {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .casilla {
            aspect-ratio: 1;
            background-color: #e2e8f0;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .casilla.sellada {
            background-color: var(--blanco);
            border: 2px solid var(--dorado);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .casilla .numero {
            font-size: 1.1rem;
            font-weight: bold;
            color: #94a3b8;
        }

        .casilla.sellada .numero {
            display: none;
        }

        .casilla .sello-img {
            display: none;
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .casilla.sellada .sello-img {
            display: block;
        }

        .status-box {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid var(--dorado);
            font-size: 1.1rem;
            width: 100%;
        }

        .reglas-box {
            text-align: center;
            font-size: 0.95rem;
            color: #4a5568;
            margin-top: 5px;
            margin-bottom: 15px;
            font-weight: 700;
            line-height: 1.6;
            width: 100%;
        }

        .btn-premio {
            display: none;
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .admin-panel {
            margin-top: 5px;
            text-align: center;
            width: 100%;
        }

        .admin-toggle {
            font-size: 0.85rem;
            color: #718096;
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            width: 100%;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-header">
        <!-- Saludo dinámico arriba del todo -->
        <div class="saludo-cliente" id="saludo-texto">¡Hola Hincha!</div>
        <!-- Logo en el centro -->
        <img src="logo-color.png" alt="La Casa Del Hincha">
        <!-- Título CLUB DE HINCHAS limpio abajo -->
        <h2>Club de Hinchas</h2>
    </div>
    
    <div class="card-body">
        <p class="info-text">¡Sella tu pasión!<br>Completa los 10 consumos y reclama tu premio de la casa</p>
        
        <div class="grid-tablero" id="tablero">
            <!-- JavaScript mapea las casillas -->
        </div>

        <div class="status-box" id="status-text">
            Tienes 0 / 10 Sellos
        </div>

        <!-- Condiciones exactas solicitadas -->
        <div class="reglas-box">
            * 1 Sello por cada $5 de consumo<br>
            * un sello por semana
        </div>

        <button class="btn-premio" id="btn-premio" onclick="reclamarPremio()">
            🎁 ¡Reclamar Premio Recompensa!
        </button>

        <div class="admin-panel">
            <button class="admin-toggle" onclick="solicitarPin()">⚙️ Panel de Control Interno (Uso del Kiosko)</button>
        </div>
    </div>
</div>

<script>
    const PIN_SECRET = "8788"; 
    const TOTAL_METAS = 10;

    let puntosActuales = parseInt(localStorage.getItem('puntos_hincha')) || 0;

    function verificarNombreCliente() {
        let nombreGuardado = localStorage.getItem('nombre_hincha');
        
        if (!nombreGuardado) {
            let nombreIngresado = prompt("¡Hola Hincha! Para personalizar tu tarjeta de fidelidad, por favor ingresa tu Nombre:");
            
            if (nombreIngresado === null || nombreIngresado.trim() === "") {
                nombreGuardado = "Hincha";
            } else {
                nombreGuardado = nombreIngresado.trim();
            }
            localStorage.setItem('nombre_hincha', nombreGuardado);
        }
        
        document.getElementById('saludo-texto').innerText = `¡Hola ${nombreGuardado}!`;
    }

    function inicializarTablero() {
        const tablero = document.getElementById('tablero');
        tablero.innerHTML = '';
        
        for (let i = 1; i <= TOTAL_METAS; i++) {
            const casilla = document.createElement('div');
            casilla.className = `casilla ${i <= puntosActuales ? 'sellada' : ''}`;
            
            const numero = document.createElement('span');
            numero.className = 'numero';
            numero.innerText = i;
            
            const imgSello = document.createElement('img');
            imgSello.className = 'sello-img';
            imgSello.src = "logo-bn.png";
            imgSello.alt = "Sello Hincha";
            
            casilla.appendChild(numero);
            casilla.appendChild(imgSello);
            tablero.appendChild(casilla);
        }
        
        actualizarEstado();
    }

    function actualizarEstado() {
        const statusText = document.getElementById('status-text');
        const btnPremio = document.getElementById('btn-premio');
        
        statusText.innerText = `Tienes ${puntosActuales} / ${TOTAL_METAS} Sellos`;
        
        if (puntosActuales >= TOTAL_METAS) {
            btnPremio.style.display = 'block';
            statusText.style.backgroundColor = '#10b981';
        } else {
            btnPremio.style.display = 'none';
            statusText.style.backgroundColor = 'var(--azul-oscuro)';
        }
    }

    function solicitarPin() {
        const pinIngresado = prompt("Introduce el PIN de administración del Kiosko:");
        
        if (pinIngresado === null) return;
        
        if (pinIngresado !== PIN_SECRET) {
            alert("❌ PIN incorrecto. Acceso denegado.");
            return;
        }

        const opcion = prompt("PIN Correcto.\nEscribe '1' para Añadir Sello.\nEscribe '0' para Reiniciar la tarjeta a cero:");
        
        if (opcion === "1") {
            if (puntosActuales < TOTAL_METAS) {
                puntosActuales++;
                localStorage.setItem('puntos_hincha', puntosActuales);
                inicializarTablero();
            } else {
                alert("El cliente ya alcanzó la meta máxima. Debe reclamar el premio.");
            }
        } else if (opcion === "0") {
            if(confirm("¿Estás seguro de reiniciar la tarjeta a 0 sellos?")) {
                puntosActuales = 0;
                localStorage.setItem('puntos_hincha', puntosActuales);
inicializarTablero();
}
} else if (opcion !== null) {
alert("Opción no válida.");
}
}
function reclamarPremio() {
alert("🎉 ¡Felicidades! Entrega el premio al Hincha y usa el panel interno con tu PIN para reiniciar su tarjeta.");
}
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('sw.js')
.then(reg => console.log('Service Worker activo'))
.catch(err => console.log('Error registrando SW', err));
});
}
verificarNombreCliente();
inicializarTablero();
