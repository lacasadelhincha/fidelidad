<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa del Hincha - Fidelidad</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b61c1c">

    <style>
        :root {
            --rojo-principal: #b61c1c;
            --azul-oscuro: #0d2347;
            --dorado: #dfa72b;
            --blanco: #ffffff;
            --gris-fondo: #f4f6f9;
            --verde-premio: #10b981;
            --naranja-reinicio: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--azul-oscuro);
            background-image: linear-gradient(135deg, var(--azul-oscuro) 0%, #050e1e 100%);
            color: var(--blanco);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card-container {
            background-color: var(--blanco);
            color: #333;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 4px solid var(--dorado);
        }

        .card-header {
            background-color: var(--rojo-principal);
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--dorado);
        }

        .saludo-dinamico {
            color: var(--dorado);
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        .card-header img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid var(--dorado);
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }

        .card-header h2 {
            color: var(--dorado);
            font-size: 1.4rem;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .card-body {
            padding: 20px;
            background-color: var(--gris-fondo);
            text-align: center;
        }

        .bloque-informativo {
            margin-bottom: 18px;
        }

        .grid-tablero {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .casilla {
            aspect-ratio: 1;
            background-color: #e2e8f0;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .casilla.sellada {
            background-color: var(--blanco);
            border: 2px solid var(--dorado);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .casilla .numero {
            font-size: 1.1rem;
            font-weight: bold;
            color: #94a3b8;
        }

        .casilla .sello-img {
            display: none;
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .status-box {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid var(--dorado);
            font-size: 1.1rem;
            transition: background-color 0.2s ease;
        }

        .reglas-adicionales {
            font-size: 0.82rem;
            color: #4a5568;
            margin-top: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.5;
        }

        .btn-premio {
            display: none;
            width: 100%;
            background-color: var(--verde-premio);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
            margin-bottom: 15px;
        }

        .btn-premio:hover {
            filter: brightness(1.05);
        }

        .btn-admin-fijo {
            width: 100%;
            background-color: #cbd5e1;
            color: #4a5568;
            border: 1px solid #94a3b8;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: block;
        }

        .btn-admin-fijo:hover {
            background-color: #bfc9d6;
        }

        .contenedor-pin-interno {
            display: none;
            margin-top: 12px;
            background-color: #eddcd2;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cb997e;
        }

        .contenedor-pin-interno input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            color: #333;
            outline: none;
        }

        .contenedor-pin-interno input:focus {
            border-color: var(--azul-oscuro);
            box-shadow: 0 0 0 2px rgba(13, 35, 71, 0.12);
        }

        .accion-kiosko {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-panel-ejecutar {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.08s ease, opacity 0.15s ease;
        }

        .btn-panel-ejecutar:active {
            transform: scale(0.98);
        }

        .btn-panel-ejecutar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-panel-ok {
            background-color: var(--azul-oscuro);
        }

        .btn-panel-reiniciar {
            background-color: var(--naranja-reinicio);
        }

        .btn-panel-cancelar {
            background-color: var(--rojo-principal);
        }

        @media (max-width: 360px) {
            .card-body {
                padding: 16px;
            }

            .grid-tablero {
                gap: 8px;
            }

            .card-header img {
                width: 115px;
                height: 115px;
            }
        }
    </style>
</head>

<body>

<div class="card-container">

    <div class="card-header">
        <div class="saludo-dinamico" id="saludo-texto">¡Hola!</div>

        <img src="logo-color.png" alt="La Casa Del Hincha">

        <h2>CLUB LCH</h2>
    </div>

    <div class="card-body">

        <div class="bloque-informativo">
            <p style="font-size: 1.1rem; color: #1a202c; font-weight: 700; margin-bottom: 4px;">
                ¡Sella tu pasión!
            </p>

            <p style="font-size: 0.78rem; color: #4a5568; font-weight: 600;">
                Completa los 10 consumos y reclama tu premio de la casa
            </p>
        </div>

        <div class="grid-tablero">

            <div class="casilla" id="c1">
                <span class="numero" id="n1">1</span>
                <img class="sello-img" id="img1" src="logo-bn.png" alt="Sello 1">
            </div>

            <div class="casilla" id="c2">
                <span class="numero" id="n2">2</span>
                <img class="sello-img" id="img2" src="logo-bn.png" alt="Sello 2">
            </div>

            <div class="casilla" id="c3">
                <span class="numero" id="n3">3</span>
                <img class="sello-img" id="img3" src="logo-bn.png" alt="Sello 3">
            </div>

            <div class="casilla" id="c4">
                <span class="numero" id="n4">4</span>
                <img class="sello-img" id="img4" src="logo-bn.png" alt="Sello 4">
            </div>

            <div class="casilla" id="c5">
                <span class="numero" id="n5">5</span>
                <img class="sello-img" id="img5" src="logo-bn.png" alt="Sello 5">
            </div>

            <div class="casilla" id="c6">
                <span class="numero" id="n6">6</span>
                <img class="sello-img" id="img6" src="logo-bn.png" alt="Sello 6">
            </div>

            <div class="casilla" id="c7">
                <span class="numero" id="n7">7</span>
                <img class="sello-img" id="img7" src="logo-bn.png" alt="Sello 7">
            </div>

            <div class="casilla" id="c8">
                <span class="numero" id="n8">8</span>
                <img class="sello-img" id="img8" src="logo-bn.png" alt="Sello 8">
            </div>

            <div class="casilla" id="c9">
                <span class="numero" id="n9">9</span>
                <img class="sello-img" id="img9" src="logo-bn.png" alt="Sello 9">
            </div>

            <div class="casilla" id="c10">
                <span class="numero" id="n10">10</span>
                <img class="sello-img" id="img10" src="logo-bn.png" alt="Sello 10">
            </div>

        </div>

        <div class="status-box" id="status-text">
            Tienes 0 / 10 Sellos
        </div>

        <div class="reglas-adicionales">
            * 1 Sello por cada $5.00 USD de consumo, 1 sello por semana.
        </div>

        <button
            class="btn-premio"
            id="btn-premio"
            type="button"
            onclick="reclamarPremio()"
        >
            🎁 ¡Reclamar Premio Recompensa!
        </button>

        <button
            class="btn-admin-fijo"
            id="boton-abrir-pin"
            type="button"
            onclick="abrirPanelKiosko()"
        >
            ⚙️ Panel de Control Interno (Uso del Kiosko)
        </button>

        <div class="contenedor-pin-interno" id="panel-pin-interno">

            <input
                type="password"
                id="input-pin-fijo"
                placeholder="Introduce PIN de Kiosko"
                inputmode="numeric"
                maxlength="4"
                autocomplete="off"
                aria-label="PIN del kiosko"
            >

            <div class="accion-kiosko">

                <button
                    type="button"
                    id="btn-anadir-sello"
                    class="btn-panel-ejecutar btn-panel-ok"
                    onclick="anadirSello()"
                >
                    ➕ Añadir 1 Sello
                </button>

                <button
                    type="button"
                    id="btn-reiniciar"
                    class="btn-panel-ejecutar btn-panel-reiniciar"
                    onclick="reiniciarTarjeta()"
                >
                    🔄 Reiniciar Tarjeta
                </button>

            </div>

            <button
                type="button"
                class="btn-panel-ejecutar btn-panel-cancelar"
                onclick="cerrarPanelKiosko()"
            >
                Cancelar
            </button>

        </div>

    </div>
</div>

<script>
    // ============================================================
    // CONFIGURACIÓN
    // ============================================================

    const TOTAL_METAS = 10;
    const PIN_SECRET = "8788";

    let puntosActuales = obtenerPuntos();

    // ============================================================
    // DATOS
    // ============================================================

    function obtenerPuntos() {
        const puntosGuardados = parseInt(
            localStorage.getItem("puntos_hincha"),
            10
        );

        if (Number.isNaN(puntosGuardados)) {
            return 0;
        }

        // Protección: nunca permitir menos de 0 ni más de 10.
        return Math.max(0, Math.min(TOTAL_METAS, puntosGuardados));
    }

    function guardarPuntos() {
        localStorage.setItem(
            "puntos_hincha",
            String(puntosActuales)
        );
    }

    // ============================================================
    // TABLERO
    // ============================================================

    function pintarTablero() {

        for (let i = 1; i <= TOTAL_METAS; i++) {

            const casilla = document.getElementById("c" + i);
            const numero = document.getElementById("n" + i);
            const imagen = document.getElementById("img" + i);

            if (!casilla || !numero || !imagen) {
                continue;
            }

            if (i <= puntosActuales) {

                casilla.classList.add("sellada");

                numero.style.display = "none";
                imagen.style.display = "block";

            } else {

                casilla.classList.remove("sellada");

                numero.style.display = "block";
                imagen.style.display = "none";
            }
        }

        const statusText = document.getElementById("status-text");
        const btnPremio = document.getElementById("btn-premio");
        const btnAnadirSello = document.getElementById("btn-anadir-sello");

        statusText.innerText =
            "Tienes " +
            puntosActuales +
            " / " +
            TOTAL_METAS +
            " Sellos";

        if (puntosActuales >= TOTAL_METAS) {

            btnPremio.style.display = "block";
            statusText.style.backgroundColor = "#10b981";

        } else {

            btnPremio.style.display = "none";
            statusText.style.backgroundColor = "var(--azul-oscuro)";
        }

        // Evita añadir más de 10 sellos.
        if (btnAnadirSello) {
            btnAnadirSello.disabled =
                puntosActuales >= TOTAL_METAS;

            btnAnadirSello.innerText =
                puntosActuales >= TOTAL_METAS
                    ? "🏆 Tarjeta completa"
                    : "➕ Añadir 1 Sello";
        }
    }

    // ============================================================
    // NOMBRE DEL HINCHA
    // ============================================================

    function cargarNombre() {

        let nombre =
            localStorage.getItem("nombre_hincha");

        if (!nombre) {

            nombre = prompt(
                "¡Hola Hincha! Para personalizar tu tarjeta, ingresa tu Nombre:"
            );

            if (!nombre || nombre.trim() === "") {
                nombre = "Hincha";
            } else {
                nombre = nombre.trim();
            }

            localStorage.setItem(
                "nombre_hincha",
                nombre
            );
        }

        document.getElementById(
            "saludo-texto"
        ).innerText =
            "¡Hola " + nombre + "!";
    }

    function modificarNombre() {

        const nombreActual =
            localStorage.getItem("nombre_hincha") || "";

        const nuevoNombre = prompt(
            "Modificar nombre:",
            nombreActual
        );

        if (
            nuevoNombre !== null &&
            nuevoNombre.trim() !== ""
        ) {

            const nombreLimpio =
                nuevoNombre.trim();

            localStorage.setItem(
                "nombre_hincha",
                nombreLimpio
            );

            document.getElementById(
                "saludo-texto"
            ).innerText =
                "¡Hola " + nombreLimpio + "!";
        }
    }

    // ============================================================
    // PANEL DEL KIOSKO
    // ============================================================

    function abrirPanelKiosko() {

        const panel =
            document.getElementById(
                "panel-pin-interno"
            );

        const boton =
            document.getElementById(
                "boton-abrir-pin"
            );

        panel.style.display = "block";
        boton.style.display = "none";

        const input =
            document.getElementById(
                "input-pin-fijo"
            );

        input.value = "";
        input.focus();
    }

    function cerrarPanelKiosko() {

        document.getElementById(
            "panel-pin-interno"
        ).style.display = "none";

        document.getElementById(
            "boton-abrir-pin"
        ).style.display = "block";

        document.getElementById(
            "input-pin-fijo"
        ).value = "";
    }

    function validarPIN() {

        const input =
            document.getElementById(
                "input-pin-fijo"
            );

        const pin =
            input.value.trim();

        if (pin !== PIN_SECRET) {

            alert(
                "❌ PIN incorrecto.\n\nAcceso denegado."
            );

            input.value = "";
            input.focus();

            return false;
        }

        return true;
    }

    // ============================================================
    // AÑADIR SELLO
    // ============================================================

    function anadirSello() {

        if (!validarPIN()) {
            return;
        }

        // Nunca superar los 10 sellos.
        if (puntosActuales >= TOTAL_METAS) {

            alert(
                "🏆 La tarjeta ya tiene los 10 sellos.\n\n" +
                "El cliente puede reclamar su premio."
            );

            cerrarPanelKiosko();
            return;
        }

        // Añadir exactamente 1 sello.
        puntosActuales++;

        guardarPuntos();
        pintarTablero();

        alert(
            "✅ ¡Sello añadido correctamente!\n\n" +
            "Sellos actuales: " +
            puntosActuales +
            " / " +
            TOTAL_METAS
        );

        cerrarPanelKiosko();
    }

    // ============================================================
    // REINICIAR TARJETA
    // ============================================================

    function reiniciarTarjeta() {

        if (!validarPIN()) {
            return;
        }

        if (puntosActuales === 0) {

            alert(
                "ℹ️ La tarjeta ya tiene 0 sellos."
            );

            cerrarPanelKiosko();
            return;
        }

        const confirmar = confirm(
            "⚠️ ATENCIÓN\n\n" +
            "¿Seguro que deseas reiniciar esta tarjeta a 0 sellos?\n\n" +
            "Sellos actuales: " +
            puntosActuales +
            " / " +
            TOTAL_METAS
        );

        if (!confirmar) {
            return;
        }

        puntosActuales = 0;

        guardarPuntos();
        pintarTablero();

        alert(
            "🔄 Tarjeta reiniciada correctamente."
        );

        cerrarPanelKiosko();
    }

    // ============================================================
    // PREMIO
    // ============================================================

    function reclamarPremio() {

        if (puntosActuales < TOTAL_METAS) {

            alert(
                "ℹ️ La tarjeta todavía no está completa."
            );

            return;
        }

        const nombre =
            localStorage.getItem("nombre_hincha") ||
            "Hincha";

        alert(
            "🎉 ¡Felicidades, " +
            nombre +
            "!\n\n" +
            "Has completado los 10 sellos.\n\n" +
            "Entrega el premio correspondiente y, " +
            "cuando el premio haya sido entregado, " +
            "usa el botón «Reiniciar Tarjeta» del panel interno."
        );
    }

    // ============================================================
    // EVENTOS
    // ============================================================

    document
        .getElementById("saludo-texto")
        .addEventListener(
            "click",
            modificarNombre
        );

    document
        .getElementById("input-pin-fijo")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    anadirSello();
                }

                if (event.key === "Escape") {
                    cerrarPanelKiosko();
                }
            }
        );

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================

    cargarNombre();
    pintarTablero();
</script>

</body>
</html>
