<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b61c1c">
<meta name="description" content="Tarjeta de fidelidad offline de La Casa del Hincha">
<link rel="manifest" href="manifest.json">
<title>La Casa del Hincha - Fidelidad</title>
<style>
:root{--rojo-principal:#b61c1c;--azul-oscuro:#0d2347;--dorado:#dfa72b;--blanco:#fff;--gris-fondo:#f4f6f9;--verde-premio:#10b981;--naranja-reinicio:#d97706}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background-color:var(--azul-oscuro);background-image:linear-gradient(135deg,var(--azul-oscuro) 0%,#050e1e 100%);color:var(--blanco);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.card-container{background:#fff;color:#333;width:100%;max-width:400px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.5);overflow:hidden;border:4px solid var(--dorado)}
.card-header{background:var(--rojo-principal);padding:20px;text-align:center;border-bottom:4px solid var(--dorado)}
.saludo-dinamico{color:var(--dorado);font-size:1.5rem;font-weight:bold;margin-bottom:12px;text-shadow:1px 1px 2px rgba(0,0,0,.8);cursor:pointer}
.card-header img{width:130px;height:130px;border-radius:50%;border:3px solid var(--dorado);background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.2);object-fit:cover}
.card-header h2{color:var(--dorado);font-size:1.4rem;margin-top:10px;text-transform:uppercase;letter-spacing:1px;text-shadow:1px 1px 2px rgba(0,0,0,.8)}
.card-body{padding:20px;background:var(--gris-fondo);text-align:center}.bloque-informativo{margin-bottom:18px}
.grid-tablero{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;width:100%}
.casilla{aspect-ratio:1;background:#e2e8f0;border:2px dashed #cbd5e1;border-radius:12px;display:flex;justify-content:center;align-items:center;position:relative}
.casilla.sellada{background:#fff;border:2px solid var(--dorado);box-shadow:0 4px 6px rgba(0,0,0,.1)}
.casilla .numero{font-size:1.1rem;font-weight:bold;color:#94a3b8}.casilla .sello-img{display:none;width:85%;height:85%;object-fit:contain}
.status-box{background:var(--azul-oscuro);color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:15px;border:1px solid var(--dorado);font-size:1.1rem;transition:background-color .2s ease}
.reglas-adicionales{font-size:.82rem;color:#4a5568;margin-top:10px;margin-bottom:20px;font-weight:600;line-height:1.5}
.btn-premio,.btn-install{display:none;width:100%;color:#fff;border:none;padding:15px;border-radius:10px;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-bottom:15px}.btn-premio{background:var(--verde-premio);box-shadow:0 4px 10px rgba(16,185,129,.4)}.btn-install{background:#2563eb;box-shadow:0 4px 10px rgba(37,99,235,.3)}
.btn-admin-fijo{width:100%;background:#cbd5e1;color:#4a5568;border:1px solid #94a3b8;padding:12px;border-radius:8px;font-size:.88rem;font-weight:bold;cursor:pointer;margin-top:15px;display:block}
.contenedor-pin-interno{display:none;margin-top:12px;background:#eddcd2;padding:15px;border-radius:10px;border:1px solid #cb997e}.contenedor-pin-interno input{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;text-align:center;font-size:1rem;color:#333;outline:none}.contenedor-pin-interno input:focus{border-color:var(--azul-oscuro);box-shadow:0 0 0 2px rgba(13,35,71,.12)}
.accion-kiosko{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}.btn-panel-ejecutar{width:100%;padding:11px;border:none;border-radius:7px;color:#fff;font-weight:bold;cursor:pointer;font-size:.95rem;transition:transform .08s ease,opacity .15s ease}.btn-panel-ejecutar:active{transform:scale(.98)}.btn-panel-ejecutar:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn-panel-ok{background:var(--azul-oscuro)}.btn-panel-reiniciar{background:var(--naranja-reinicio)}.btn-panel-cancelar{background:var(--rojo-principal)}
.estado-offline{font-size:.75rem;font-weight:700;color:#475569;margin-top:8px}.estado-offline.online{color:#047857}.estado-offline.offline{color:#b45309}
@media(max-width:360px){.card-body{padding:16px}.grid-tablero{gap:8px}.card-header img{width:115px;height:115px}}
</style>
</head>
<body>
<div class="card-container">
<div class="card-header"><div class="saludo-dinamico" id="saludo-texto">¡Hola!</div><img src="logo-color.png" alt="La Casa Del Hincha"><h2>CLUB LCH</h2></div>
<div class="card-body">
<div class="bloque-informativo"><p style="font-size:1.1rem;color:#1a202c;font-weight:700;margin-bottom:4px">¡Sella tu pasión!</p><p style="font-size:.78rem;color:#4a5568;font-weight:600">Completa los 10 consumos y reclama tu premio de la casa</p></div>
<div class="grid-tablero"><div class="casilla" id="c1"><span class="numero" id="n1">1</span><img class="sello-img" id="img1" src="logo-bn.png" alt="Sello 1"></div><div class="casilla" id="c2"><span class="numero" id="n2">2</span><img class="sello-img" id="img2" src="logo-bn.png" alt="Sello 2"></div><div class="casilla" id="c3"><span class="numero" id="n3">3</span><img class="sello-img" id="img3" src="logo-bn.png" alt="Sello 3"></div><div class="casilla" id="c4"><span class="numero" id="n4">4</span><img class="sello-img" id="img4" src="logo-bn.png" alt="Sello 4"></div><div class="casilla" id="c5"><span class="numero" id="n5">5</span><img class="sello-img" id="img5" src="logo-bn.png" alt="Sello 5"></div><div class="casilla" id="c6"><span class="numero" id="n6">6</span><img class="sello-img" id="img6" src="logo-bn.png" alt="Sello 6"></div><div class="casilla" id="c7"><span class="numero" id="n7">7</span><img class="sello-img" id="img7" src="logo-bn.png" alt="Sello 7"></div><div class="casilla" id="c8"><span class="numero" id="n8">8</span><img class="sello-img" id="img8" src="logo-bn.png" alt="Sello 8"></div><div class="casilla" id="c9"><span class="numero" id="n9">9</span><img class="sello-img" id="img9" src="logo-bn.png" alt="Sello 9"></div><div class="casilla" id="c10"><span class="numero" id="n10">10</span><img class="sello-img" id="img10" src="logo-bn.png" alt="Sello 10"></div></div>
<div class="status-box" id="status-text">Tienes 0 / 10 Sellos</div>
<div class="reglas-adicionales">* 1 Sello por cada $5.00 USD de consumo, 1 sello por semana.</div>
<button class="btn-premio" id="btn-premio" type="button" onclick="reclamarPremio()">🎁 ¡Reclamar Premio Recompensa!</button>
<button class="btn-install" id="btn-install" type="button" onclick="instalarApp()">📲 Instalar aplicación</button>
<button class="btn-admin-fijo" id="boton-abrir-pin" type="button" onclick="abrirPanelKiosko()">⚙️ Panel de Control Interno (Uso del Kiosko)</button>
<div class="contenedor-pin-interno" id="panel-pin-interno"><input type="password" id="input-pin-fijo" placeholder="Introduce PIN de Kiosko" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN del kiosko"><div class="accion-kiosko"><button type="button" id="btn-anadir-sello" class="btn-panel-ejecutar btn-panel-ok" onclick="anadirSello()">➕ Añadir 1 Sello</button><button type="button" id="btn-reiniciar" class="btn-panel-ejecutar btn-panel-reiniciar" onclick="reiniciarTarjeta()">🔄 Reiniciar Tarjeta</button></div><button type="button" class="btn-panel-ejecutar btn-panel-cancelar" onclick="cerrarPanelKiosko()">Cancelar</button></div>
<div class="estado-offline" id="estado-offline">💾 Datos guardados en este dispositivo</div>
</div></div>
<script>
const TOTAL_METAS=10;const PIN_SECRET='8788';const DB_NAME='lch_fidelidad_db';const DB_VERSION=1;const STORE='app';
let puntosActuales=0;let nombreActual='Hincha';let deferredInstallPrompt=null;
function abrirDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'clave'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbGet(clave){const db=await abrirDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).get(clave);req.onsuccess=()=>resolve(req.result?.valor);req.onerror=()=>reject(req.error)})}
async function dbSet(clave,valor){const db=await abrirDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({clave,valor});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function inicializarDatos(){const p=await dbGet('puntos_hincha');const n=await dbGet('nombre_hincha');if(p===undefined){const legacy=parseInt(localStorage.getItem('puntos_hincha'),10);puntosActuales=Number.isNaN(legacy)?0:Math.max(0,Math.min(TOTAL_METAS,legacy));await dbSet('puntos_hincha',puntosActuales)}else puntosActuales=Math.max(0,Math.min(TOTAL_METAS,Number(p)||0));if(n===undefined){nombreActual=(localStorage.getItem('nombre_hincha')||'').trim()||'';if(!nombreActual){nombreActual=prompt('¡Hola Hincha! Para personalizar tu tarjeta, ingresa tu Nombre:')?.trim()||'Hincha'}await dbSet('nombre_hincha',nombreActual)}else nombreActual=String(n||'Hincha');document.getElementById('saludo-texto').innerText='¡Hola '+nombreActual+'!';pintarTablero()}
async function guardarPuntos(){await dbSet('puntos_hincha',puntosActuales)}
async function pintarTablero(){for(let i=1;i<=TOTAL_METAS;i++){const c=document.getElementById('c'+i),n=document.getElementById('n'+i),img=document.getElementById('img'+i);if(i<=puntosActuales){c.classList.add('sellada');n.style.display='none';img.style.display='block'}else{c.classList.remove('sellada');n.style.display='block';img.style.display='none'}}const status=document.getElementById('status-text'),premio=document.getElementById('btn-premio'),add=document.getElementById('btn-anadir-sello');status.innerText='Tienes '+puntosActuales+' / '+TOTAL_METAS+' Sellos';if(puntosActuales>=TOTAL_METAS){premio.style.display='block';status.style.backgroundColor='#10b981'}else{premio.style.display='none';status.style.backgroundColor='var(--azul-oscuro)'}add.disabled=puntosActuales>=TOTAL_METAS;add.innerText=puntosActuales>=TOTAL_METAS?'🏆 Tarjeta completa':'➕ Añadir 1 Sello'}
async function modificarNombre(){const nuevo=prompt('Modificar nombre:',nombreActual);if(nuevo!==null&&nuevo.trim()){nombreActual=nuevo.trim();await dbSet('nombre_hincha',nombreActual);document.getElementById('saludo-texto').innerText='¡Hola '+nombreActual+'!'}}
function abrirPanelKiosko(){const panel=document.getElementById('panel-pin-interno');panel.style.display='block';document.getElementById('boton-abrir-pin').style.display='none';const input=document.getElementById('input-pin-fijo');input.value='';input.focus()}
function cerrarPanelKiosko(){document.getElementById('panel-pin-interno').style.display='none';document.getElementById('boton-abrir-pin').style.display='block';document.getElementById('input-pin-fijo').value=''}
function validarPIN(){const input=document.getElementById('input-pin-fijo');if(input.value.trim()!==PIN_SECRET){alert('❌ PIN incorrecto.\n\nAcceso denegado.');input.value='';input.focus();return false}return true}
async function anadirSello(){if(!validarPIN())return;if(puntosActuales>=TOTAL_METAS){alert('🏆 La tarjeta ya tiene los 10 sellos.\n\nEl cliente puede reclamar su premio.');cerrarPanelKiosko();return}puntosActuales++;await guardarPuntos();pintarTablero();alert('✅ ¡Sello añadido correctamente!\n\nSellos actuales: '+puntosActuales+' / '+TOTAL_METAS);cerrarPanelKiosko()}
async function reiniciarTarjeta(){if(!validarPIN())return;if(puntosActuales===0){alert('ℹ️ La tarjeta ya tiene 0 sellos.');cerrarPanelKiosko();return}if(!confirm('⚠️ ATENCIÓN\n\n¿Seguro que deseas reiniciar esta tarjeta a 0 sellos?\n\nSellos actuales: '+puntosActuales+' / '+TOTAL_METAS))return;puntosActuales=0;await guardarPuntos();pintarTablero();alert('🔄 Tarjeta reiniciada correctamente.');cerrarPanelKiosko()}
function reclamarPremio(){if(puntosActuales<TOTAL_METAS){alert('ℹ️ La tarjeta todavía no está completa.');return}alert('🎉 ¡Felicidades, '+nombreActual+'!\n\nHas completado los 10 sellos.\n\nEntrega el premio correspondiente y, cuando el premio haya sido entregado, usa «Reiniciar Tarjeta».')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;document.getElementById('btn-install').style.display='block'});
async function instalarApp(){if(!deferredInstallPrompt){alert('Para instalarla, usa el menú del navegador y elige «Añadir a pantalla de inicio» o «Instalar aplicación».');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.getElementById('btn-install').style.display='none'}
window.addEventListener('appinstalled',()=>{document.getElementById('btn-install').style.display='none'});
function actualizarEstado(){const el=document.getElementById('estado-offline');if(navigator.onLine){el.textContent='🌐 Con conexión • datos guardados localmente';el.className='estado-offline online'}else{el.textContent='📴 Sin Internet • la app sigue funcionando';el.className='estado-offline offline'}}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));
window.addEventListener('online',actualizarEstado);window.addEventListener('offline',actualizarEstado);document.getElementById('saludo-texto').addEventListener('click',modificarNombre);document.getElementById('input-pin-fijo').addEventListener('keydown',e=>{if(e.key==='Enter')anadirSello();if(e.key==='Escape')cerrarPanelKiosko()});actualizarEstado();inicializarDatos().catch(err=>{console.error(err);alert('No se pudo abrir el almacenamiento local. La aplicación necesita un navegador moderno.')});
</script>
</body></html>
