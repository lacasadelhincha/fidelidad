<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa del Hincha - Fidelidad</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b61c1c">
    <style>
        :root {
            --rojo-principal: #b61c1c;
            --azul-oscuro: #0d2347;
            --dorado: #dfa72b;
            --blanco: #ffffff;
            --gris-fondo: #f4f6f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--azul-oscuro);
            background-image: linear-gradient(135deg, var(--azul-oscuro) 0%, #050e1e 100%);
            color: var(--blanco);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card-container {
            background-color: var(--blanco);
            color: #333;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid var(--dorado);
        }

        .card-header {
            background-color: var(--rojo-principal);
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--dorado);
        }

        .saludo-dinamico {
            color: var(--dorado);
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .card-header img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid var(--dorado);
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            object-fit: cover;
        }

        .card-header h2 {
            color: var(--dorado);
            font-size: 1.4rem;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .card-body {
            padding: 20px;
            background-color: var(--gris-fondo);
            text-align: center;
        }

        .bloque-informativo {
            margin-bottom: 18px;
        }

        .grid-tablero {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .casilla {
            aspect-ratio: 1;
            background-color: #e2e8f0;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .casilla.sellada {
            background-color: var(--blanco);
            border: 2px solid var(--dorado);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .casilla .numero {
            font-size: 1.1rem;
            font-weight: bold;
            color: #94a3b8;
        }

        .casilla .sello-img {
            display: none;
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .status-box {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid var(--dorado);
            font-size: 1.1rem;
        }

        .reglas-adicionales {
            font-size: 0.82rem;
            color: #4a5568;
            margin-top: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.5;
        }

        .btn-premio {
            display: none;
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
            margin-bottom: 15px;
        }

        .btn-admin-fijo {
            width: 100%;
            background-color: #cbd5e1;
            color: #4a5568;
            border: 1px solid #94a3b8;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: block;
        }

        .contenedor-pin-interno {
            display: none;
            margin-top: 12px;
            background-color: #eddcd2;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cb997e;
        }

        .contenedor-pin-interno input, .contenedor-pin-interno select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            color: #333;
        }

        .botones-admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-panel-ejecutar {
            padding: 10px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-panel-ok { background-color: var(--azul-oscuro); }
        .btn-panel-cancelar { background-color: var(--rojo-principal); }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-header">
        <div class="saludo-dinamico" id="saludo-texto" onclick="let n = prompt('Modificar nombre:', localStorage.getItem('nombre_hincha') || ''); if(n){localStorage.setItem('nombre_hincha', n.trim()); document.getElementById('saludo-texto').innerText = '¡Hola ' + n.trim() + '!';}">¡Hola!</div>
        <img src="logo-color.png" alt="La Casa Del Hincha">
        <h2>CLUB LCH</h2>
    </div>
    
    <div class="card-body">
        <div class="bloque-informativo">
            <p style="font-size: 1.1rem; color: #1a202c; font-weight: 700; margin-bottom: 4px;">¡Sella tu pasión!</p>
            <p style="font-size: 0.78rem; color: #4a5568; font-weight: 600;">Completa los 10 consumos y reclama tu premio de la casa</p>
        </div>
        
        <div class="grid-tablero">
            <div class="casilla" id="c1"><span class="numero" id="n1">1</span><img class="sello-img" id="img1" src="logo-bn.png"></div>
            <div class="casilla" id="c2"><span class="numero" id="n2">2</span><img class="sello-img" id="img2" src="logo-bn.png"></div>
            <div class="casilla" id="c3"><span class="numero" id="n3">3</span><img class="sello-img" id="img3" src="logo-bn.png"></div>
            <div class="casilla" id="c4"><span class="numero" id="n4">4</span><img class="sello-img" id="img4" src="logo-bn.png"></div>
            <div class="casilla" id="c5"><span class="numero" id="n5">5</span><img class="sello-img" id="img5" src="logo-bn.png"></div>
            <div class="casilla" id="c6"><span class="numero" id="n6">6</span><img class="sello-img" id="img6" src="logo-bn.png"></div>
            <div class="casilla" id="c7"><span class="numero" id="n7">7</span><img class="sello-img" id="img7" src="logo-bn.png"></div>
            <div class="casilla" id="c8"><span class="numero" id="n8">8</span><img class="sello-img" id="img8" src="logo-bn.png"></div>
            <div class="casilla" id="c9"><span class="numero" id="n9">9</span><img class="sello-img" id="img9" src="logo-bn.png"></div>
            <div class="casilla" id="c10"><span class="numero" id="n10">10</span><img class="sello-img" id="img10" src="logo-bn.png"></div>
        </div>

        <div class="status-box" id="status-text">Tienes 0 / 10 Sellos</div>

        <div class="reglas-adicionales">
            * 1 Sello por cada $5.00 USD de consumo, 1 sello por semana.
        </div>

        <button class="btn-premio" id="btn-premio" onclick="alert('🎉 ¡Felicidades! Entrega el premio al Hincha y usa el panel interno para reiniciar su tarjeta.')">
            🎁 ¡Reclamar Premio Recompensa!
        </button>

        <button class="btn-admin-fijo" id="boton-abrir-pin" onclick="document.getElementById('panel-pin-interno').style.display='block'; document.getElementById('boton-abrir-pin').style.display='none';">
            ⚙️ Panel de Control Interno (Uso del Kiosko)
        </button>

        <div class="contenedor-pin-interno" id="panel-pin-interno">
            <input type="password" id="input-pin-fijo" placeholder="Introduce PIN de Kiosko" inputmode="numeric">
            <select id="select-accion-fijo">
                <option value="1">➕ Añadir Sello</option>
                <option value="0">🔄 Reiniciar Tarjeta a 0</option>
            </select>
            <div class="botones-admin-grid">
                <button class="btn-panel-ejecutar btn-panel-ok" onclick="
                    let p = document.getElementById('input-pin-fijo').value;
                    let a = document.getElementById('select-accion-fijo').value;
                    if (p !== '8788') {
                        alert('❌ PIN incorrecto.');
                    } else {
                        let pts = parseInt(localStorage.getItem('puntos_hincha')) || 0;
                        if (a === '1') { 
                            if (pts < 10) { pts++; localStorage.setItem('puntos_hincha', pts); } 
                        } else if (a === '0') { 
if (confirm('¿Reiniciar tarjeta?')) { pts = 0; localStorage.setItem('puntos_hincha', pts); }
}
for (let i = 1; i <= 10; i++) {
let casilla = document.getElementById('c' + i);
let numero = document.getElementById('n' + i);
let imagen = document.getElementById('img' + i);
if (i <= pts) {
casilla.classList.add('sellada'); numero.style.display = 'none'; imagen.style.display = 'block';
} else {
casilla.classList.remove('sellada'); numero.style.display = 'block'; imagen.style.display = 'none';
}
}
document.getElementById('status-text').innerText = 'Tienes ' + pts + ' / 10 Sellos';
if (pts >= 10) {
document.getElementById('btn-premio').style.display = 'block';
document.getElementById('status-text').style.backgroundColor = '#10b981';
} else {
document.getElementById('btn-premio').style.display = 'none';
document.getElementById('status-text').style.backgroundColor = '#0d2347';
}
document.getElementById('panel-pin-interno').style.display = 'none';
document.getElementById('boton-abrir-pin').style.display = 'block';
document.getElementById('input-pin-fijo').value = '';
}

let puntosActuales = parseInt(localStorage.getItem('puntos_hincha')) || 0;
let nombre = localStorage.getItem('nombre_hincha');
if (!nombre) {
nombre = prompt("¡Hola Hincha! Para personalizar tu tarjeta, ingresa tu Nombre:");
if (!nombre || nombre.trim() === "") { nombre = "Hincha"; }
else { nombre = nombre.trim(); }
localStorage.setItem('nombre_hincha', nombre);
}
document.getElementById('saludo-texto').innerText = "¡Hola " + nombre + "!";
for (let i = 1; i <= 10; i++) {
let casilla = document.getElementById('c' + i);
let numero = document.getElementById('n' + i);
let imagen = document.getElementById('img' + i);
if (i <= puntosActuales) {
casilla.classList.add('sellada');
numero.style.display = 'none';
imagen.style.display = 'block';
} else {
casilla.classList.remove('sellada');
numero.style.display = 'block';
imagen.style.display = 'none';
}
}
document.getElementById('status-text').innerText = "Tienes " + puntosActuales + " / 10 Sellos";
if (puntosActuales >= 10) {
document.getElementById('btn-premio').style.display = 'block';
document.getElementById('status-text').style.backgroundColor = '#10b981';
} else {
document.getElementById('btn-premio').style.display = 'none';
document.getElementById('status-text').style.backgroundColor = 'var(--azul-oscuro)';
}
